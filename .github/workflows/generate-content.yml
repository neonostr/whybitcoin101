name: Generate PAGE.md

on:
  push:
    branches: [main]
    paths:
      - "src/components/Hero.tsx"
      - "src/components/MoneyProblem.tsx"
      - "src/components/Basics.tsx"
      - "src/components/WhyBitcoin.tsx"
      - "src/components/Resources.tsx"
      - "src/components/FAQ.tsx"
      - "src/components/Contact.tsx"
      - "scripts/generate-markdown.mjs"
      - ".github/workflows/generate-content.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-content
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate PAGE.md
        run: node scripts/generate-markdown.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet content/PAGE.md; then
            echo "No changes to content/PAGE.md"
            exit 0
          fi
          git add content/PAGE.md
          git commit -m "chore: regenerate content/PAGE.md [skip ci]"
          git push